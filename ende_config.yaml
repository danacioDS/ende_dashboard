pipeline:
  start_year: 2023
  end_year: 2025

  distribution:
    download_prefix: c_ret_
    download_folder: downloads_distribucion
    data_folder: data_distribuidor
    entity_columns: [AGENTE, EMPRESA]
    energy_unit: MWh
    power_unit: kW

    extraction:
      energia: {cols: [0, 1, 6], rename: [AGENTE, "Energía MWh", "Potencia kW"]}
      ingresos: {cols: [0, 1, 3, 4, 7], rename: [AGENTE, "Energía MWh", "Ingresos Energía MWh", "Ingresos Renovables MWh", "Ingresos Potencia kW"]}
      peaje: {cols: [0, 10, 12, 14, 16], rename: [AGENTE, "Peaje ENDE Trans. USD/MWh", "Peaje ISA USD/MWh", "Peaje ENDE USD/MWh", "Peaje TESA USD/MWh"]}
      precios: {cols: [0, 2, 5], rename: [AGENTE, "Precio Energía USD/MWh", "Precio Potencia USD/kW"]}

  generation:
    download_prefix: c_iny_
    download_folder: downloads_generacion
    data_folder: data_generacion
    entity_columns: [CENTRAL, GENERADOR, TECNOLOGIA]
    energy_unit: kWh
    power_unit: kW

    extraction:
      energia: {cols: [0, 1, 5], rename: [CENTRAL, "Energía kWh", "Potencia kW"]}
      ingresos: {cols: [0, 1, 3, 4, 7], rename: [CENTRAL, "Energía KWh", "Ingresos Energía USD", "Ingresos Renovables USD", "Ingresos Potencia USD"]}
      peaje: {cols: [0, 10, 12, 14, 16, 18], rename: [CENTRAL, "Peaje ENDE Trans. USD/MWh", "Peaje ISA USD/MWh", "Peaje ENDE USD/MWh", "Peaje TESA USD/MWh", "Peaje filiales ENDE US$/MWh"]}
      precios: {cols: [0, 2, 6], rename: [CENTRAL, "Precio Energía USD/MWh", "Precio Potencia USD/kW"]}

