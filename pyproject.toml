[project]
name = "ende-dashboard"
version = "0.2.0"
description = "ETL pipeline + Streamlit dashboard for Bolivian electricity market data (CNDC)"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "streamlit>=1.28",
    "plotly>=5.15",
    "openpyxl>=3.1",
    "requests>=2.31",
    "pyexcel>=0.7",
    "pyexcel-xls>=0.7",
    "pyexcel-xlsx>=0.6",
    "xlrd>=2.0",
    "pyarrow>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
    "mypy>=1.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
